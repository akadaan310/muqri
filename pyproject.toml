[project]
name = "qaari-eval"
version = "0.1.0"
description = "Quranic Tajweed acoustic analysis, automated scoring and reciter fingerprinting"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"datasets/index_reciters.py" = ["E402"]
"notebooks/*.ipynb" = ["E501"]  # shell commands

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
